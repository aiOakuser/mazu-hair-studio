[phases.setup]
  # Next 16 requires Node >= 20.9; Nixpacks' default Node is older.
  nixPkgs = ["nodejs_22"]

[phases.install]
  # --include=dev so the build still gets typescript/tailwind/@types even if
  # NODE_ENV=production leaks into the build environment.
  cmds = ["npm ci --include=dev"]

[phases.build]
  cmds = ["npm run build"]

[start]
  # Bind explicitly: Docker sets $HOSTNAME to the container id, and the port
  # must match Coolify's "Ports exposes" (8015) or the proxy can't reach us.
  cmd = "npm run start -- --hostname 0.0.0.0 --port ${PORT:-8015}"
