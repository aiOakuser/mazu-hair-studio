# Nginx server block for mariahairstylist.beauty.globaldesignerhub.com
#
# This is an isolated block for this one subdomain — it does not touch
# the existing globaldesignerhub.com / *.globaldesignerhub.com Gunicorn
# config already running on this box. Static files only, no Node process.
#
# Install:
#   sudo cp maria-hair-studio.conf /etc/nginx/sites-available/maria-hair-studio
#   sudo ln -s /etc/nginx/sites-available/maria-hair-studio /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#   sudo certbot --nginx -d mariahairstylist.beauty.globaldesignerhub.com

server {
    listen 80;
    listen [::]:80;
    server_name mariahairstylist.beauty.globaldesignerhub.com;

    root /var/www/maria-hair-studio/out;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Static export ships hashed, immutable Next.js assets under /_next/static
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
